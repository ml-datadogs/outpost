[General]
test-timeout = 5
loglevel = notify
use-local-host-item-for-proxy = true
read-etc-hosts = true
always-real-ip = gitlab.dalkos.ru, *.dalkos.ru
skip-proxy = *.dalkos.ru, rdg.dalkos.ru, ts02.dalkos.ru, 94.125.187.51, 95.80.66.212
tun-excluded-routes = 94.125.187.51/32, 95.80.66.212/32

[Proxy]
dalkos-wg = wireguard, section-name=Dalkos
# --- Outpost Fleet v2 (IPRoyal Static Residential ISP) ---
iproyal-nl-direct = socks5, 78.143.239.176, 12324, REDACTED_9, REDACTED_10
iproyal-via-ist = socks5, 78.143.239.176, 12324, REDACTED_11, REDACTED_12, underlying-proxy=ist-trojan
iphoster-pl-trojan = trojan, 91.227.186.239, 8443, password=REDACTED_1, block-quic=off, skip-cert-verify=true, sni=www.bing.com
# --- Legacy proxies ---
amster snell = snell, 167.172.36.104, 26344, psk=REDACTED_2, version=4, reuse=true, block-quic=off, obfs=http
ist-trojan = trojan, istanbul-max.duckdns.org, 8444, password=REDACTED_3, block-quic=off
ist-hysteria = hysteria2, istanbul-max.duckdns.org, 8443, password=REDACTED_4, block-quic=off
frank-hysteria = hysteria2, german-max.duckdns.org, 443, password=REDACTED_5, block-quic=off
frank-trojan = trojan, german-max.duckdns.org, 8443, password=REDACTED_6, block-quic=off

[Proxy Group]
dalkos = select, dalkos-wg, DIRECT
ai-clean = select, iproyal-nl-direct, iproyal-via-ist, include-all-proxies=0
main-group = select, ist-trojan, iphoster-pl-trojan, "amster snell", ist-hysteria, include-all-proxies=0
amster group = select, iproyal-nl-direct, "amster snell", include-all-proxies=0
turkey-group = select, ist-hysteria, include-all-proxies=0

