[General]
test-timeout = 5
loglevel = notify
use-local-host-item-for-proxy = true
read-etc-hosts = true
always-real-ip = gitlab.dalkos.ru, *.dalkos.ru
skip-proxy = *.dalkos.ru, rdg.dalkos.ru, ts02.dalkos.ru, 94.125.187.51, 95.80.66.212
tun-excluded-routes = 94.125.187.51/32, 95.80.66.212/32

[Proxy]
dalkos-wg = wireguard, section-name=Dalkos
iproyal-nl-direct = socks5, 78.143.239.176, 12324, REDACTED_USERNAME, REDACTED_PASSWORD
warsaw-snell = snell, 82.26.91.158, 5432, psk=REDACTED_PSK, version=6, mode=default, reuse=true
singapore-snell = snell, 51.79.204.241, 22784, psk=REDACTED_PSK, version=6, mode=default, reuse=true

[Proxy Group]
# General internet: Warsaw first, Singapore on failure; no direct fallback.
main-group = fallback, warsaw-snell, singapore-snell, interval=300
# AI and billing retain the residential Netherlands exit.
ai-clean = select, iproyal-nl-direct
# Preserve the current DIRECT selection (office network).
dalkos = select, dalkos-wg, DIRECT

