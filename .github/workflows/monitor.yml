name: publish-subscriptions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}
  push:
    paths:
      - "state/**"
      - "outpost/render.py"
      - "server/**"

concurrency:
  group: outpost-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Render + publish only. Inventory is never mutated or committed here.
      # For liveness / rotate / reap, run locally:
      #   uv run outpost monitor
      #   uv run outpost rotate --reap
      OUTPOST_AI_PROXY_URL: ${{ secrets.OUTPOST_AI_PROXY_URL }}
      SOPS_AGE_KEY_FILE: ${{ github.workspace }}/.age/outpost.key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv sync --frozen
          # sops for inventory decryption
          SOPS_VER=v3.9.0
          curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.amd64"
          chmod +x /usr/local/bin/sops

      - name: Materialize secrets
        run: |
          mkdir -p .age && chmod 700 .age
          printf '%s' "${{ secrets.AGE_KEY }}" > .age/outpost.key
          chmod 600 .age/outpost.key

      - name: Render subscriptions
        run: uv run outpost render --out dist-subs

      - name: Publish subscriptions to Cloudflare KV
        if: ${{ vars.CF_OK == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          npx --yes wrangler kv key put --namespace-id "$KV_NAMESPACE_ID" surge --path dist-subs/outpost.surge.conf
          npx --yes wrangler kv key put --namespace-id "$KV_NAMESPACE_ID" happ  --path dist-subs/outpost.happ.txt
          # Note: set repo variable CF_OK=true once the Worker + KV namespace exist
          # so this publish step runs.
