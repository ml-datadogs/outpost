[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outpost"
version = "0.1.0"
description = "Automated proxy fleet: provision, monitor, and rotate sing-box proxies on RU-friendly hosts, and render Surge/Happ subscriptions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
    "paramiko>=3.4",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
]

[project.scripts]
outpost = "outpost.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pre-commit>=3.7",
]

[tool.uv]
package = true

[tool.ty.environment]
python-version = "3.9"

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["outpost", "tests", "agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = [
    "B008",   # function call in argument defaults (Typer uses this pattern)
    # Keep typing.Optional / List style: PEP 604 unions break pydantic runtime
    # annotation resolution on Python 3.9 (our minimum supported version).
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"agent/probe.py" = ["E402"]  # sys.path manipulation before imports is intentional

[tool.setuptools.packages.find]
where = ["."]
include = ["outpost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
