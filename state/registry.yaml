# Provider / region registry. Safe to commit (NO secrets here).
# Eligibility for hosting an exit node requires THREE gates:
#   1. region.country != RU            (a RU exit bypasses nothing)
#   2. region.enabled == true          (reachability-gated; the probe flips this)
#   3. provider.policy_ok == true      (accepts RU users + usable payment)
#
# Populate `regions` from live APIs:  outpost discover --provider aeza
# then copy the printed product_ref / country values in here and set canary hosts.
version: 1
providers:
  - name: aeza
    policy_ok: true
    sanctioned: true   # OFAC 2025: usable but risky; never the sole provider
    notes: "RU-friendly billing + hourly. Pin to NON-RU regions (DE/NL/FI). Sanctioned -> diversify."
    regions:
      # Example shape - replace product_id/canary with values from `outpost discover`.
      - code: "Germany"
        country: DE
        city: "Frankfurt"
        canary: null
        enabled: false
        product_ref: { product_id: "" }
      - code: "Netherlands"
        country: NL
        city: "Amsterdam"
        canary: null
        enabled: false
        product_ref: { product_id: "" }
      - code: "Finland"
        country: FI
        city: "Helsinki"
        canary: null
        enabled: true
        product_ref: { product_id: "355" }  # HELs-1 shared VPS (live Aeza catalog)

  - name: zomro
    policy_ok: true
    sanctioned: false
    notes: "NL-based, RU-friendly. Use NL (non-RU). Orders provision via root password."
    regions:
      - code: "nl"
        country: NL
        city: "Netherlands"
        canary: null
        enabled: false
        product_ref: { pricelist: "", datacenter: "", os: "" }

  # PARKED by operator choice (2026-08-15), not a policy failure: the InvAPI
  # integration (panel login + traffic plans + deploy options) is more moving parts
  # than it earns right now. Code in outpost/providers/hostkey.py is kept intact -
  # flip policy_ok back to true to re-enable provisioning/rotation here.
  # Existing adopted hostkey nodes keep running and stay manageable.
  - name: hostkey
    policy_ok: false
    sanctioned: false
    notes: "PARKED (operator choice, not policy). RU-friendly InvAPI billing, hourly VPS (vm.pico)."
    regions:
      - code: "108-NL"
        country: NL
        city: "vm.pico"
        canary: null
        enabled: true
        product_ref:
          preset: "108"
          preset_name: "vm.pico"
          location_name: "NL"
          os_id: "237"
          deploy_period: monthly
      - code: "276-DE"
        country: DE
        city: "vm.v3-pico"
        canary: null
        enabled: true
        product_ref:
          preset: "276"
          preset_name: "vm.v3-pico"
          location_name: "DE"
          os_id: "237"
          deploy_period: monthly

  # MANUAL provider (no provisioning API): order in the panel, then
  #   uv run outpost adopt --provider iphoster --ip <ip> --country <cc>
  # Rotation never auto-provisions here (see MANUAL_PROVIDERS in outpost/providers).
  - name: iphoster
    policy_ok: true    # EE jurisdiction (IPhoster OU); RU-friendly payments: RU card gateway, Payeer, crypto (BTC/ETH/LTC)
    sanctioned: false
    notes: >-
      Panel/WHMCS only - no API, so adopt-tier. KVM VPS, cheap (from ~128 RUB/mo).
      Locations: DE/PL/FR/GB/US/CA. Caveat from reviews: location selection via panel
      is unreliable (may land in a different country) - verify the exit IP geo before
      adopting. Known-good in practice: amnezia/xray stacks run fine on their VPS.
    regions:
      - code: "de"
        country: DE
        city: "Germany"
        canary: null
        enabled: false   # manual tier; enabled flag kept false so no gate ever selects it
        product_ref: {}
      - code: "pl"
        country: PL
        city: "Poland"
        canary: null
        enabled: false
        product_ref: {}

  # Documented EXCLUSION (kept for visibility; not eligible).
  - name: hetzner
    policy_ok: false   # bans/suspends RU/CIS accounts and freezes payment
    sanctioned: false
    notes: "EXCLUDED on policy gate. Network-reachable but account/payment hostile to RU users."
    regions: []
